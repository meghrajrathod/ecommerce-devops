name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend ./microservices/frontend

      - name: Build Product Service Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service ./microservices/product-service

      - name: Build User Service Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service ./microservices/user-service

      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service